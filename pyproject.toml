[project]
name = "cleanowners"
version = "2.0.0"
description = "GitHub Action that cleans up CODEOWNERS files by removing users who are no longer part of the organization."
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.6.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "flake8==7.4.1",
    "isort==9.0.2",
    "mypy==2.3.1",
    "mypy-extensions==1.1.0",
    "pylint==4.0.9",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
